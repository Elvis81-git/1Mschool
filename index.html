<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 百萬小學堂 - 100點終極挑戰</title>
    <style>
        body { 
            font-family: '微軟正黑體', sans-serif; 
            margin: 0; 
            background: radial-gradient(circle at center, #0a1930 0%, #020611 100%);
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* 雙欄版面配置 */
        .game-area { flex: 3; display: flex; flex-direction: column; padding: 20px; border-right: 2px solid #34495e; }
        .sidebar { flex: 1; background: rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }

        /* 頂部：標題與卡牌區 */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(255, 255, 255, 0.05); border-bottom: 2px solid #f39c12; border-radius: 15px; margin-bottom: 20px; }
        .title { font-size: 28px; font-weight: bold; color: #f1c40f; text-shadow: 2px 2px 4px #000; margin: 0; }

        .lifelines { display: flex; gap: 10px; }
        .card-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: 2px solid #85c1e9; color: white; padding: 8px 15px; font-size: 16px;
            border-radius: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .card-btn:hover { transform: scale(1.05); background: linear-gradient(135deg, #2980b9, #1f618d); }
        .card-btn:disabled, .card-btn.used { background: #555; border-color: #333; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-bailout { background: linear-gradient(135deg, #e74c3c, #c0392b); border-color: #f1948a; }
        .btn-bailout:hover { background: linear-gradient(135deg, #c0392b, #922b21); }

        /* 中間：題目區 */
        .question-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .question-box { width: 100%; background: rgba(0, 30, 80, 0.8); border: 3px solid #f1c40f; border-radius: 20px; padding: 35px; font-size: 32px; line-height: 1.5; box-shadow: 0 0 20px rgba(241, 196, 15, 0.3); text-align: left; white-space: pre-wrap; }

        /* 中下：選項區 */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 20px 10px 20px; }
        .option-box {
            background: linear-gradient(90deg, #1abc9c, #16a085); border: 2px solid #a3e4d7; border-radius: 50px;
            padding: 15px 25px; font-size: 24px; cursor: pointer; text-align: left; transition: 0.3s;
        }
        .option-box:hover { background: linear-gradient(90deg, #16a085, #0e6655); transform: scale(1.02); }
        
        /* 選項互動狀態 */
        .option-box.selected { background: #34495e; border-color: #3498db; color: #fff; box-shadow: 0 0 15px #3498db; }
        .option-box.locked-style { background: #f39c12; border-color: #f1c40f; color: #fff; }
        .option-box.correct { background: #27ae60; border-color: #2ecc71; color: #fff; animation: blink 0.5s 3; }
        .option-box.wrong { background: #c0392b; border-color: #e74c3c; color: #fff; }
        .option-box.hidden-opt { visibility: hidden; }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* 底部：動態互動按鈕區 */
        .action-container { margin-bottom: 25px; padding: 0 20px; }
        .btn-action {
            font-size: 26px; padding: 15px 50px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; max-width: 500px;
            background: linear-gradient(135deg, #f1c40f, #f39c12); border: 2px solid #fbc02d; color: #0a1930; box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
        }
        .btn-action:hover { transform: scale(1.03); background: linear-gradient(135deg, #f39c12, #e67e22); }
        .btn-action:disabled { background: #444; border-color: #222; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-action.next-stage { background: linear-gradient(135deg, #2ecc71, #27ae60); border-color: #a3e4d7; color: white; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); }
        .btn-action.next-stage:hover { background: linear-gradient(135deg, #27ae60, #1e8449); }

        /* 獎金階梯區 */
        .ladder-title { font-size: 24px; color: #3498db; margin-top: 0; border-bottom: 2px solid #3498db; padding-bottom: 10px;}
        .ladder-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column-reverse; flex: 1; justify-content: space-evenly; }
        .ladder-item { font-size: 22px; color: #7f8c8d; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; transition: 0.3s; }
        .ladder-item.active { background: #f39c12; color: #fff; font-size: 26px; font-weight: bold; box-shadow: 0 0 15px #f39c12; }
        .ladder-item.passed { color: #f1c40f; }

        /* Modal 彈出視窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: #fff; color: #333; padding: 40px; border-radius: 15px; width: 500px; text-align: center; box-shadow: 0 0 30px rgba(255,255,255,0.2); }
        .modal-content h2 { font-size: 32px; margin-top: 0; }
        .score-display { font-size: 48px; color: #e74c3c; font-weight: bold; margin: 20px 0; }
        
        .bar-container { display: flex; align-items: flex-end; justify-content: space-around; height: 200px; margin-top: 20px; border-bottom: 2px solid #ccc; padding-bottom: 5px;}
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 50px; }
        .bar { width: 100%; background: #3498db; border-radius: 5px 5px 0 0; transition: height 1s ease-out; }
        .bar-label { margin-top: 10px; font-weight: bold; font-size: 20px;}
        .bar-pct { font-size: 16px; margin-bottom: 5px; font-weight: bold; color: #e67e22;}
    </style>
</head>
<body>

    <div class="game-area">
        <div class="header">
            <h1 class="title">🎓 挑戰100點</h1>
            <div class="lifelines">
                <button id="card-callout" class="card-btn" onclick="useCallOut()">📞 Call Out</button>
                <button id="card-5050" class="card-btn" onclick="use5050()">✂️ 刪去法</button>
                <button id="card-vote" class="card-btn" onclick="useVote()">📊 投票</button>
                <button id="bailoutBtn" class="card-btn btn-bailout" onclick="confirmBailout()">🛑 放棄作答</button>
            </div>
        </div>

        <div class="question-container">
            <div id="questionText" class="question-box">載入中...</div>
        </div>

        <div class="options-grid" id="optionsContainer"></div>

        <div class="action-container">
            <button id="actionBtn" class="btn-action" onclick="handleActionClick()" disabled>請先選擇一個選項</button>
        </div>
    </div>

    <div class="sidebar">
        <h3 class="ladder-title">💰 點數階梯</h3>
        <ul class="ladder-list" id="ladderList"></ul>
    </div>

    <div id="voteModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color: #2980b9;">📊 現場投票統計</h2>
            <div class="bar-container" id="voteBars"></div>
            <button class="card-btn" style="margin-top: 30px; background: #e74c3c; border-color:#c0392b; width: 100%;" onclick="closeModal('voteModal')">關閉結果</button>
        </div>
    </div>

    <div id="gameOverModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="endGameTitle">遊戲結束</h2>
            <p id="endGameMsg" style="font-size: 20px; color: #555;">您獲得的最終點數為：</p>
            <div class="score-display"><span id="finalScoreText">0</span> 點</div>
            <button class="card-btn" style="margin-top: 20px; font-size: 20px; width: 100%;" onclick="location.reload()">🔄 重新挑戰</button>
        </div>
    </div>

<script>
    let questions = [];
    let currentIndex = 0;
    
    // 遊戲狀態控制：'selecting' (選題中), 'selected' (已選未鎖), 'counting' (倒數中), 'revealed' (已公布結果)
    let gameState = 'selecting'; 
    let selectedOptionIndex = null;

    const prizePoints = [1, 2, 3, 5, 8, 13, 21, 34, 55, 100];
    
    async function initGame() {
        try {
            const res = await fetch('./db.json');
            if (!res.ok) throw new Error('找不到題庫');
            let allQuestions = await res.json();
            
            // 隨機抽取 10 題
            questions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 10);
            
            renderLadder();
            loadQuestion(0);
        } catch (err) {
            document.getElementById('questionText').innerText = "❌ 題庫載入失敗！請確認檔案放在 GitHub Pages 上運行。";
        }
    }

    function renderLadder() {
        const list = document.getElementById('ladderList');
        list.innerHTML = '';
        prizePoints.forEach((pts, i) => {
            const li = document.createElement('li');
            li.className = 'ladder-item';
            li.id = 'ladder-' + i;
            li.innerHTML = `<span>第 ${i + 1} 題</span><span>${pts} 點</span>`;
            list.appendChild(li);
        });
    }

    function updateLadderUI() {
        prizePoints.forEach((pts, i) => {
            const li = document.getElementById('ladder-' + i);
            li.classList.remove('active', 'passed');
            if (i === currentIndex) li.classList.add('active');
            else if (i < currentIndex) li.classList.add('passed');
        });
    }

    function loadQuestion(index) {
        if (index >= questions.length || index >= 10) {
            endGame('win');
            return;
        }

        currentIndex = index;
        selectedOptionIndex = null;
        gameState = 'selecting';
        
        updateLadderUI();
        document.getElementById('bailoutBtn').disabled = false;
        
        // 重置動態按鈕
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = "請先選擇一個選項";
        actionBtn.className = "btn-action";
        actionBtn.disabled = true;

        const q = questions[currentIndex];
        document.getElementById('questionText').innerText = q.question;
        
        const optsDiv = document.getElementById('optionsContainer');
        optsDiv.innerHTML = '';
        
        q.options.forEach((opt, i) => {
            const btn = document.createElement('div');
            btn.className = 'option-box';
            btn.id = 'opt-' + i;
            btn.innerText = opt;
            btn.onclick = () => selectOption(i);
            optsDiv.appendChild(btn);
        });
    }

    // 點擊選項
    function selectOption(selectedIndex) {
        if (gameState !== 'selecting' && gameState !== 'selected') return;
        
        gameState = 'selected';
        selectedOptionIndex = selectedIndex;

        // 清除其他選項的高亮，並高亮當前點選
        const allOpts = document.querySelectorAll('.option-box');
        allOpts.forEach(el => el.classList.remove('selected'));
        
        const selectedEl = document.getElementById('opt-' + selectedIndex);
        if (selectedEl) selectedEl.classList.add('selected');

        // 開啟鎖定按鈕權限
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = "確認鎖定答案 🔒";
        actionBtn.disabled = false;
    }

    // 處理底部的多功能大按鈕點擊
    function handleActionClick() {
        if (gameState === 'selected') {
            startLockCountdown();
        } else if (gameState === 'revealed') {
            loadQuestion(currentIndex + 1);
        }
    }

    // 開始 5 秒鎖定倒數
    function startLockCountdown() {
        gameState = 'counting';
        document.getElementById('bailoutBtn').disabled = true; // 鎖定中不允許中途放棄
        
        // 變更選項外觀為「節目鎖定色」
        const selectedEl = document.getElementById('opt-' + selectedOptionIndex);
        if (selectedEl) {
            selectedEl.classList.remove('selected');
            selectedEl.classList.add('locked-style');
        }

        let secondsLeft = 5;
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.disabled = true; // 倒數期間不能連點
        actionBtn.innerText = `🤔 鎖定中... ${secondsLeft} 秒`;

        let countdownTimer = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                actionBtn.innerText = `🤔 鎖定中... ${secondsLeft} 秒`;
            } else {
                clearInterval(countdownTimer);
                revealAnswer();
            }
        }, 1000);
    }

    // 公布解答
    function revealAnswer() {
        gameState = 'revealed';
        const correctIndex = questions[currentIndex].answer;
        const selectedEl = document.getElementById('opt-' + selectedOptionIndex);
        const actionBtn = document.getElementById('actionBtn');
        
        if (selectedEl) selectedEl.classList.remove('locked-style');
        
        if (selectedOptionIndex === correctIndex) {
            // ✅ 答對
            if (selectedEl) selectedEl.classList.add('correct');
            actionBtn.disabled = false;
            actionBtn.className = "btn-action next-stage";
            
            if (currentIndex === 9) {
                actionBtn.innerText = "👑 通關成功！查看終極結算 🏆";
                actionBtn.onclick = () => endGame('win');
            } else {
                actionBtn.innerText = "答對了！進入下一題 ➡️";
            }
        } else {
            // ❌ 答錯
            if (selectedEl) selectedEl.classList.add('wrong');
            const correctEl = document.getElementById('opt-' + correctIndex);
            if (correctEl) correctEl.classList.add('correct');
            
            actionBtn.innerText = "挑戰失敗 🛑";
            actionBtn.disabled = true;
            
            // 延遲 2.5 秒後直接切入失敗結算畫面
            setTimeout(() => endGame('wrong'), 2500);
        }
    }

    // 放棄作答結算
    function confirmBailout() {
        if (gameState !== 'selecting' && gameState !== 'selected') return;
        if (confirm("確定要放棄作答嗎？結算將獲得「上一題點數的一半」！")) {
            endGame('bailout');
        }
    }

    // 遊戲結束結算
    function endGame(reason) {
        const modal = document.getElementById('gameOverModal');
        const title = document.getElementById('endGameTitle');
        const scoreText = document.getElementById('finalScoreText');
        const msg = document.getElementById('endGameMsg');
        
        let finalPoints = 0;

        if (reason === 'win') {
            title.innerText = "🏆 恭喜破關！";
            title.style.color = "#27ae60";
            msg.innerText = "太神啦！您成功答對所有題目，抱走最高點數：";
            finalPoints = 100;
        } else {
            let previousPoints = currentIndex === 0 ? 0 : prizePoints[currentIndex - 1];
            finalPoints = previousPoints / 2;
            
            if (reason === 'wrong') {
                title.innerText = "❌ 挑戰失敗";
                msg.innerText = "很遺憾答錯了！依規則獲得上一題點數的 1/2：";
            } else if (reason === 'bailout') {
                title.innerText = "🛑 成功結算";
                title.style.color = "#f39c12";
                msg.innerText = "明智的選擇！結算獲得上一題點數的 1/2：";
            }
        }

        scoreText.innerText = finalPoints % 1 !== 0 ? finalPoints.toFixed(1) : finalPoints; 
        modal.style.display = 'flex';
    }

    // --- 卡牌救濟機制 (限制只能在選答案階段使用) ---
    function useCallOut() {
        if (gameState !== 'selecting' && gameState !== 'selected') return;
        const btn = document.getElementById('card-callout');
        if (btn.disabled) return;
        btn.disabled = true; btn.classList.add('used');
        alert("📞 啟動 Call Out！請玩家指定現場一位同學來協助解答！");
    }

    function use5050() {
        if (gameState !== 'selecting' && gameState !== 'selected') return;
        const btn = document.getElementById('card-5050');
        if (btn.disabled) return;
        btn.disabled = true; btn.classList.add('used');
        
        const correctIndex = questions[currentIndex].answer;
        let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
        const targetToRemove = wrongIndices[Math.floor(Math.random() * wrongIndices.length)];
        
        const optEl = document.getElementById('opt-' + targetToRemove);
        if(optEl) optEl.classList.add('hidden-opt');
    }

    function useVote() {
        if (gameState !== 'selecting' && gameState !== 'selected') return;
        const btn = document.getElementById('card-vote');
        if (btn.disabled) return;
        btn.disabled = true; btn.classList.add('used');
        
        const correctIndex = questions[currentIndex].answer;
        let votes = [0, 0, 0, 0];
        let remaining = 100;
        
        votes[correctIndex] = Math.floor(Math.random() * 31) + 40; 
        remaining -= votes[correctIndex];

        let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
        wrongIndices.forEach((idx, i) => {
            const el = document.getElementById('opt-' + idx);
            if (el && el.classList.contains('hidden-opt')) {
                votes[idx] = 0; 
            } else if (i === wrongIndices.length - 1) {
                votes[idx] = remaining; 
            } else {
                let r = Math.floor(Math.random() * (remaining + 1));
                votes[idx] = r;
                remaining -= r;
            }
        });

        const labels = ['A', 'B', 'C', 'D'];
        const container = document.getElementById('voteBars');
        container.innerHTML = '';
        votes.forEach((pct, idx) => {
            container.innerHTML += `
                <div class="bar-wrapper">
                    <div class="bar-pct">${pct}%</div>
                    <div class="bar" style="height: 0px;" data-target="${pct * 1.5}px"></div>
                    <div class="bar-label">${labels[idx]}</div>
                </div>
            `;
        });

        document.getElementById('voteModal').style.display = 'flex';
        setTimeout(() => {
            document.querySelectorAll('.bar').forEach(b => {
                b.style.height = b.getAttribute('data-target');
            });
        }, 100);
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    initGame();
</script>
</body>
</html>
