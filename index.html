<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 百萬小學堂</title>
    <style>
        body { 
            font-family: '微軟正黑體', sans-serif; 
            margin: 0; 
            background: radial-gradient(circle at center, #0a1930 0%, #020611 100%);
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂部：標題與卡牌區 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 2px solid #f39c12;
        }

        .title { font-size: 32px; font-weight: bold; color: #f1c40f; text-shadow: 2px 2px 4px #000; margin: 0; }

        .lifelines { display: flex; gap: 15px; }
        .card-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: 2px solid #85c1e9;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .card-btn:hover { transform: scale(1.05); background: linear-gradient(135deg, #2980b9, #1f618d); }
        .card-btn:disabled, .card-btn.used {
            background: #555; border-color: #333; color: #888;
            cursor: not-allowed; transform: none; box-shadow: none;
        }

        /* 中間：題目區 */
        .question-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 10%;
        }
        .question-box {
            width: 100%;
            background: rgba(0, 30, 80, 0.8);
            border: 3px solid #f1c40f;
            border-radius: 20px;
            padding: 40px;
            font-size: 36px;
            line-height: 1.5;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
            text-align: left;
            white-space: pre-wrap;
        }

        /* 底部：選項區 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 0 10% 50px 10%;
        }
        .option-box {
            background: linear-gradient(90deg, #1abc9c, #16a085);
            border: 2px solid #a3e4d7;
            border-radius: 50px;
            padding: 20px 30px;
            font-size: 28px;
            cursor: pointer;
            text-align: left;
            transition: 0.3s;
            position: relative;
        }
        .option-box:hover { background: linear-gradient(90deg, #16a085, #0e6655); transform: scale(1.02); }
        
        /* 選項狀態顏色 */
        .option-box.selected { background: #f39c12; border-color: #f1c40f; color: #fff; }
        .option-box.correct { background: #27ae60; border-color: #2ecc71; color: #fff; animation: blink 0.5s 3; }
        .option-box.wrong { background: #c0392b; border-color: #e74c3c; color: #fff; }
        .option-box.hidden-opt { visibility: hidden; }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* 教師控制按鈕 */
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            opacity: 0.2; 
            transition: 0.3s;
        }
        .controls:hover { opacity: 1; }
        .ctrl-btn {
            background: #444; color: white; border: none; padding: 10px 20px;
            font-size: 16px; border-radius: 5px; cursor: pointer;
        }
        .ctrl-btn:hover { background: #666; }

        /* 投票結果 Modal */
        #voteModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none;
            align-items: center; justify-content: center; z-index: 2000;
        }
        .vote-content {
            background: #fff; color: #333; padding: 40px; border-radius: 15px;
            width: 500px; text-align: center;
        }
        .bar-container { display: flex; align-items: flex-end; justify-content: space-around; height: 200px; margin-top: 20px; border-bottom: 2px solid #ccc; padding-bottom: 5px;}
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 50px; }
        .bar { width: 100%; background: #3498db; border-radius: 5px 5px 0 0; transition: height 1s ease-out; }
        .bar-label { margin-top: 10px; font-weight: bold; font-size: 20px;}
        .bar-pct { font-size: 16px; margin-bottom: 5px; font-weight: bold; color: #e67e22;}
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">🎓 百萬小學堂</h1>
        <div class="lifelines">
            <button id="card-callout" class="card-btn" onclick="useCallOut()">📞 Call Out (求救)</button>
            <button id="card-5050" class="card-btn" onclick="use5050()">✂️ 刪去法</button>
            <button id="card-vote" class="card-btn" onclick="useVote()">📊 現場投票</button>
        </div>
    </div>

    <div class="question-container">
        <div id="questionText" class="question-box">載入中... (如果在本機直接雙擊開啟，可能會被瀏覽器阻擋讀取檔案。建議放到 GitHub Pages 上觀看)</div>
    </div>

    <div class="options-grid" id="optionsContainer">
        </div>

    <div class="controls">
        <span style="line-height: 40px; margin-right: 10px;">題號: <span id="qIndexDisplay">1</span> / <span id="qTotalDisplay">?</span></span>
        <button class="ctrl-btn" onclick="resetCards()">🔄 重置卡牌</button>
        <button class="ctrl-btn" onclick="prevQuestion()">⬅️ 上一題</button>
        <button class="ctrl-btn" onclick="nextQuestion()">下一題 ➡️</button>
    </div>

    <div id="voteModal">
        <div class="vote-content">
            <h2>📊 全班投票結果統計</h2>
            <div class="bar-container" id="voteBars"></div>
            <button class="card-btn" style="margin-top: 30px; background: #e74c3c; border-color:#c0392b;" onclick="closeVote()">關閉結果</button>
        </div>
    </div>

<script>
    let questions = [];
    let currentIndex = 0;
    let isAnswering = true; 
    
    // 網頁載入時直接讀取同目錄下的 db.json
    async function initGame() {
        try {
            // 【關鍵修改】直接抓取靜態檔案
            const res = await fetch('./db.json');
            if (!res.ok) throw new Error('找不到題庫');
            questions = await res.json();
            document.getElementById('qTotalDisplay').innerText = questions.length;
            loadQuestion(0);
        } catch (err) {
            document.getElementById('questionText').innerText = "❌ 無法讀取 db.json！\n\n原因可能是：\n1. 檔案名稱不對。\n2. 您是直接在電腦雙擊打開 HTML 檔 (瀏覽器安全機制會阻擋本地檔案讀取)。\n\n⭐ 解決方法：直接將這兩個檔案上傳到 GitHub Pages，就能正常運作了！";
        }
    }

    // 載入指定題目
    function loadQuestion(index) {
        if (index < 0 || index >= questions.length) return;
        currentIndex = index;
        isAnswering = true;
        
        document.getElementById('qIndexDisplay').innerText = currentIndex + 1;
        const q = questions[currentIndex];
        
        document.getElementById('questionText').innerText = q.question;
        
        const optsDiv = document.getElementById('optionsContainer');
        optsDiv.innerHTML = '';
        
        q.options.forEach((opt, i) => {
            const btn = document.createElement('div');
            btn.className = 'option-box';
            btn.id = 'opt-' + i;
            btn.innerText = opt;
            btn.onclick = () => selectOption(i);
            optsDiv.appendChild(btn);
        });
    }

    // 玩家選擇答案
    function selectOption(selectedIndex) {
        if (!isAnswering) return; 
        isAnswering = false;

        const correctIndex = questions[currentIndex].answer;
        const selectedEl = document.getElementById('opt-' + selectedIndex);
        
        selectedEl.classList.add('selected');

        setTimeout(() => {
            selectedEl.classList.remove('selected');
            if (selectedIndex === correctIndex) {
                selectedEl.classList.add('correct');
            } else {
                selectedEl.classList.add('wrong');
                document.getElementById('opt-' + correctIndex).classList.add('correct');
            }
        }, 1500);
    }

    // 1. Call Out
    function useCallOut() {
        if(!isAnswering) return;
        const btn = document.getElementById('card-callout');
        if (btn.disabled) return;
        btn.disabled = true;
        btn.classList.add('used');
        alert("📞 啟動 Call Out！請玩家指定現場一位同學來協助解答！");
    }

    // 2. 刪去法
    function use5050() {
        if(!isAnswering) return;
        const btn = document.getElementById('card-5050');
        if (btn.disabled) return;
        const correctIndex = questions[currentIndex].answer;
        let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
        const targetToRemove = wrongIndices[Math.floor(Math.random() * wrongIndices.length)];
        const optEl = document.getElementById('opt-' + targetToRemove);
        if(optEl) optEl.classList.add('hidden-opt');
        btn.disabled = true;
        btn.classList.add('used');
    }

    // 3. 現場投票
    function useVote() {
        if(!isAnswering) return;
        const btn = document.getElementById('card-vote');
        if (btn.disabled) return;
        btn.disabled = true;
        btn.classList.add('used');
        
        const correctIndex = questions[currentIndex].answer;
        let votes = [0, 0, 0, 0];
        let remaining = 100;
        
        votes[correctIndex] = Math.floor(Math.random() * 31) + 40; 
        remaining -= votes[correctIndex];

        let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
        wrongIndices.forEach((idx, i) => {
            const el = document.getElementById('opt-' + idx);
            if (el && el.classList.contains('hidden-opt')) {
                votes[idx] = 0;
            } else if (i === wrongIndices.length - 1) {
                votes[idx] = remaining; 
            } else {
                let r = Math.floor(Math.random() * (remaining + 1));
                votes[idx] = r;
                remaining -= r;
            }
        });

        const labels = ['A', 'B', 'C', 'D'];
        const container = document.getElementById('voteBars');
        container.innerHTML = '';
        votes.forEach((pct, idx) => {
            container.innerHTML += `
                <div class="bar-wrapper">
                    <div class="bar-pct">${pct}%</div>
                    <div class="bar" style="height: 0px;" data-target="${pct * 1.5}px"></div>
                    <div class="bar-label">${labels[idx]}</div>
                </div>
            `;
        });

        document.getElementById('voteModal').style.display = 'flex';
        setTimeout(() => {
            document.querySelectorAll('.bar').forEach(b => {
                b.style.height = b.getAttribute('data-target');
            });
        }, 100);
    }

    function closeVote() {
        document.getElementById('voteModal').style.display = 'none';
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            loadQuestion(currentIndex + 1);
        } else {
            alert("🏁 這已經是最後一題囉！");
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            loadQuestion(currentIndex - 1);
        }
    }

    function resetCards() {
        const btns = document.querySelectorAll('.card-btn');
        btns.forEach(btn => {
            btn.disabled = false;
            btn.classList.remove('used');
        });
        alert("🔄 三張卡牌已重置！");
    }

    initGame();
</script>
</body>
</html>
